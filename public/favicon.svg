<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect fill="#4fb8b2" width="180" height="180" />

  <!-- Graduation cap and book icon -->
  <g transform="translate(45, 35)">
    <!-- Book -->
    <rect x="10" y="20" width="50" height="40" fill="none" stroke="white" stroke-width="3" rx="2" />
    <line x1="35" y1="20" x2="35" y2="60" stroke="white" stroke-width="2" />

    <!-- Graduation cap -->
    <path d="M 5 20 L 35 5 L 65 20 Z" fill="white" />
    <rect x="25" y="18" width="20" height="4" fill="white" />

    <!-- Tassel -->
    <line x1="35" y1="22" x2="35" y2="35" stroke="white" stroke-width="2" />
    <circle cx="35" cy="37" r="2" fill="white" />
  </g>
</svg>