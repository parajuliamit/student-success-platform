<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fb8b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a8a85;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#grad1)" />

  <!-- Main icon group -->
  <g transform="translate(256, 256)">
    <!-- School building base -->
    <rect x="-80" y="-40" width="160" height="120" fill="white" rx="8" />

    <!-- Roof -->
    <polygon points="0,-40 -90,-15 90,-15" fill="#e0e0e0" />
    <polygon points="0,-40 90,-15 0,-20" fill="#d0d0d0" />

    <!-- Door -->
    <rect x="-25" y="40" width="50" height="60" fill="#4fb8b2" />
    <circle cx="-10" cy="70" r="3" fill="white" />

    <!-- Windows -->
    <g fill="none" stroke="white" stroke-width="2">
      <!-- Left column windows -->
      <rect x="-65" y="-20" width="20" height="20" />
      <line x1="-55" y1="-20" x2="-55" y2="0" />
      <line x1="-65" y1="-10" x2="-45" y2="-10" />

      <rect x="-65" y="10" width="20" height="20" />
      <line x1="-55" y1="10" x2="-55" y2="30" />
      <line x1="-65" y1="20" x2="-45" y2="20" />

      <!-- Right column windows -->
      <rect x="45" y="-20" width="20" height="20" />
      <line x1="55" y1="-20" x2="55" y2="0" />
      <line x1="45" y1="-10" x2="65" y2="-10" />

      <rect x="45" y="10" width="20" height="20" />
      <line x1="55" y1="10" x2="55" y2="30" />
      <line x1="45" y1="20" x2="65" y2="20" />
    </g>

    <!-- Flag pole with education flag -->
    <rect x="70" y="-60" width="4" height="50" fill="white" />
    <polygon points="74,-60 74,-45 95,-52" fill="#ff6b6b" />

    <!-- Books stacked below -->
    <g transform="translate(-50, 80)">
      <rect width="30" height="15" fill="#4fb8b2" />
      <rect y="8" width="32" height="14" fill="#2ba89f" />
      <rect y="15" width="34" height="14" fill="#1d7a73" />
    </g>

    <!-- Graduation cap -->
    <g transform="translate(50, 75)">
      <path d="M -15 0 L 0 -12 L 15 0 Z" fill="#4fb8b2" />
      <rect x="-10" y="0" width="20" height="3" fill="#4fb8b2" />
      <line x1="0" y1="3" x2="0" y2="12" stroke="#4fb8b2" stroke-width="2" />
      <circle cx="0" cy="14" r="1.5" fill="#4fb8b2" />
    </g>
  </g>
</svg>